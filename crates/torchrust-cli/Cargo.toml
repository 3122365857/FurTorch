[package]
name = "torchrust-cli"
version = "0.1.0"
edition = "2021"
description = "CLI for TorchRust drop processing - reads JSON from stdin, writes to stdout"

[[bin]]
name = "torchrust-cli"
path = "src/main.rs"

[dependencies]
torchrust-core = { path = "../torchrust-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
